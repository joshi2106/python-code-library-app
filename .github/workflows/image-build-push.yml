name: Build Scan Push To ECR

on:
push:
branches:
- master

env:
AWS_REGION: us-east-1

jobs:
build-scan-push:

```
runs-on: ubuntu-latest

permissions:
  id-token: write
  contents: read

strategy:
  matrix:
    include:

      - service: frontend
        ecr_repo: library-frontend
        dockerfile: Dockerfile
        context: .

      - service: auth
        ecr_repo: auth-service
        dockerfile: auth/Dockerfile
        context: ./auth

      - service: book
        ecr_repo: book-service
        dockerfile: book/Dockerfile
        context: ./book

      - service: borrow
        ecr_repo: borrow-service
        dockerfile: borrow/Dockerfile
        context: ./borrow

steps:

  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      aws-region: ${{ env.AWS_REGION }}

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Set Image Tag
    run: |
      echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

  - name: Build Docker Image
    run: |
      docker build \
        -f ${{ matrix.dockerfile }} \
        -t ${{ matrix.service }}:${IMAGE_TAG} \
        ${{ matrix.context }}

  - name: Trivy Security Scan
    uses: aquasecurity/trivy-action@0.28.0
    with:
      image-ref: '${{ matrix.service }}:${IMAGE_TAG}'
      format: table
      exit-code: 1
      ignore-unfixed: true
      severity: HIGH,CRITICAL

  - name: Tag Image
    run: |
      docker tag \
        ${{ matrix.service }}:${IMAGE_TAG} \
        ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${IMAGE_TAG}

  - name: Push Commit Tag
    run: |
      docker push \
        ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${IMAGE_TAG}

  - name: Tag Latest
    run: |
      docker tag \
        ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${IMAGE_TAG} \
        ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:latest

  - name: Push Latest
    run: |
      docker push \
        ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:latest

  - name: Show Image Information
    run: |
      echo "Service    : ${{ matrix.service }}"
      echo "Repository : ${{ matrix.ecr_repo }}"
      echo "Tag        : ${IMAGE_TAG}"
```
